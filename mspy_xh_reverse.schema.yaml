# Rime schema
# encoding: utf-8
# 由主方案加载的通配反查词典，无需加入方案菜单。

schema:
  schema_id: mspy_xh_reverse
  name: 微软双拼音形反查
  version: "1"

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - table_translator

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz;`"

translator:
  dictionary: mspy_xh_reverse
  enable_sentence: false
  enable_user_dict: false
  enable_completion: true
